<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Checklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .checklist-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        .checklist-header {
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .checklist-header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .auth-section {
            margin-bottom: 20px;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .checklist-item:hover {
            background: #e9ecef;
        }
        .checklist-item.completed {
            background: #d4edda;
        }
        .checklist-item.completed .item-text {
            text-decoration: line-through;
            color: #6c757d;
        }
        .form-check-input {
            width: 1.5rem;
            height: 1.5rem;
            margin-right: 12px;
            cursor: pointer;
            border: 2px solid #667eea;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .item-text {
            flex: 1;
            cursor: pointer;
            font-size: 1.05rem;
            color: #333;
        }
        .btn-delete {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 8px;
            transition: color 0.2s;
        }
        .btn-delete:hover {
            color: #c82333;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .progress-container {
            margin-bottom: 20px;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .loading-spinner {
            display: inline-block;
        }
        .sync-status {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 10px;
        }
        .sync-status.syncing {
            color: #0d6efd;
        }
        .sync-status.error {
            color: #dc3545;
        }
        .sync-status.success {
            color: #198754;
        }
        .user-info {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .loading-auth {
            text-align: center;
            padding: 40px 20px;
        }
        .spinner-border {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="checklist-container">
        <div class="checklist-header">
            <div>
                <h1>📋 My Checklist</h1>
                <small class="user-info" id="user-info">Not signed in</small>
            </div>
            <button class="btn btn-outline-primary btn-sm" id="auth-btn" disabled>Loading...</button>
        </div>

        <div id="loading-auth" class="loading-auth">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Initializing Google authentication...</p>
        </div>

        <div id="auth-section" class="auth-section" style="display: none;">
            <!-- Loading indicator -->
            <div id="loading-section" style="display: none; text-align: center; margin-bottom: 20px;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-muted mt-2">Loading your tasks...</p>
            </div>

            <!-- Main checklist section -->
            <div id="checklist-section">
                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="progress-text">
                        Progress: <span id="progress-text">0/0</span>
                    </div>
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>

                <!-- Input Section -->
                <div class="input-group mb-3">
                    <input type="text" id="new-item-input" class="form-control" placeholder="Add a new task..." aria-label="Add a new task">
                    <button class="btn btn-primary" type="button" id="add-btn">Add</button>
                </div>

                <!-- Checklist Items -->
                <div id="checklist-items" class="checklist-items">
                    <!-- Items will be dynamically added here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"/>
                    </svg>
                    <p>No tasks yet. Add one to get started!</p>
                </div>

                <!-- Sync Status -->
                <div class="sync-status" id="sync-status"></div>

                <!-- Clear All Button -->
                <button class="btn btn-outline-danger btn-sm w-100 mt-4" id="clear-all-btn">Clear All</button>
            </div>
        </div>

        <div id="not-auth-section" style="display: none; text-align: center; padding: 40px 20px;">
            <p class="text-muted">Sign in with your Google account to store and sync your tasks across devices.</p>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script>
        // Configuration
        const CLIENT_ID = '420712359419-0n65jvsd0hgb8noubtmhobjtftqe5gn1.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyAxGF5xDn0f9t2gSASQyK-_F25CIZWoXmQ';
        const SCOPES = 'https://www.googleapis.com/auth/drive.appfolder';
        const FILE_NAME = 'checklist-data.json';

        // State
        let items = [];
        let fileId = null;
        let tokenClient = null;
        let accessToken = null;
        let isInitialized = false;

        // DOM Elements
        const authBtn = document.getElementById('auth-btn');
        const authSection = document.getElementById('auth-section');
        const notAuthSection = document.getElementById('not-auth-section');
        const itemsContainer = document.getElementById('checklist-items');
        const newItemInput = document.getElementById('new-item-input');
        const addBtn = document.getElementById('add-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const emptyState = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const syncStatus = document.getElementById('sync-status');
        const userInfo = document.getElementById('user-info');
        const loadingSection = document.getElementById('loading-section');
        const checklistSection = document.getElementById('checklist-section');
        const loadingAuth = document.getElementById('loading-auth');

        // Wait for Google libraries to load
        function waitForGoogleAPIs() {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (typeof google !== 'undefined' && google.accounts && typeof gapi !== 'undefined') {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 100);
                // Timeout after 10 seconds
                setTimeout(() => {
                    clearInterval(checkInterval);
                    resolve();
                }, 10000);
            });
        }

        // Initialize Google API
        async function initializeGoogleAPI() {
            try {
                await waitForGoogleAPIs();

                if (typeof google === 'undefined' || !google.accounts) {
                    throw new Error('Google OAuth library failed to load');
                }

                // Initialize OAuth token client
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: async (response) => {
                        if (response.error) {
                            console.error('Auth error:', response.error);
                            showSyncStatus('Authentication failed', 'error');
                            return;
                        }
                        accessToken = response.access_token;
                        userInfo.textContent = 'Signed in to Google Drive';
                        userInfo.className = 'user-info';
                        authSection.style.display = 'block';
                        notAuthSection.style.display = 'none';
                        authBtn.textContent = 'Sign out';
                        await loadItems();
                    }
                });

                // Initialize Google API client for Drive
                if (typeof gapi !== 'undefined' && gapi.client) {
                    await gapi.client.init({
                        apiKey: API_KEY,
                        scope: SCOPES
                    });
                }

                isInitialized = true;
                loadingAuth.style.display = 'none';
                notAuthSection.style.display = 'block';
                authBtn.disabled = false;
                authBtn.textContent = 'Sign in with Google';
            } catch (error) {
                console.error('Error initializing Google API:', error);
                loadingAuth.innerHTML = '<p class="text-danger">Failed to initialize. Please refresh the page.</p>';
            }
        }

        // Handle authentication
        authBtn.addEventListener('click', async () => {
            if (!isInitialized) return;

            if (accessToken) {
                // Sign out
                google.accounts.oauth2.revoke(accessToken, () => {
                    accessToken = null;
                    items = [];
                    fileId = null;
                    userInfo.textContent = 'Not signed in';
                    authSection.style.display = 'none';
                    notAuthSection.style.display = 'block';
                    authBtn.textContent = 'Sign in with Google';
                    renderItems();
                });
            } else {
                // Sign in
                if (tokenClient) {
                    tokenClient.requestAccessToken();
                }
            }
        });

        // Update progress bar
        function updateProgress() {
            const total = items.length;
            const completed = items.filter(item => item.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            progressBar.style.width = percentage + '%';
            progressBar.setAttribute('aria-valuenow', percentage);
            progressText.textContent = `${completed}/${total}`;
        }

        // Render all items
        function renderItems() {
            itemsContainer.innerHTML = '';

            if (items.length === 0) {
                emptyState.style.display = 'block';
                updateProgress();
                return;
            }

            emptyState.style.display = 'none';

            items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `checklist-item ${item.completed ? 'completed' : ''}`;
                itemDiv.innerHTML = `
                    <input type="checkbox" class="form-check-input" ${item.completed ? 'checked' : ''} data-index="${index}">
                    <span class="item-text" data-index="${index}">${escapeHtml(item.text)}</span>
                    <button class="btn-delete" data-index="${index}">×</button>
                `;
                itemsContainer.appendChild(itemDiv);
            });

            // Attach event listeners
            document.querySelectorAll('.form-check-input').forEach(checkbox => {
                checkbox.addEventListener('change', toggleItem);
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', deleteItem);
            });

            document.querySelectorAll('.item-text').forEach(text => {
                text.addEventListener('click', function() {
                    const checkbox = this.parentElement.querySelector('.form-check-input');
                    checkbox.checked = !checkbox.checked;
                    toggleItem.call(checkbox);
                });
            });

            updateProgress();
        }

        // Toggle item completion
        async function toggleItem(e) {
            const index = parseInt(e.target.dataset.index);
            items[index].completed = !items[index].completed;
            await saveItems();
            renderItems();
        }

        // Delete item
        async function deleteItem(e) {
            const index = parseInt(e.target.dataset.index);
            items.splice(index, 1);
            await saveItems();
            renderItems();
        }

        // Add new item
        async function addItem() {
            const text = newItemInput.value.trim();
            if (!text) {
                newItemInput.focus();
                return;
            }

            items.push({
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            });

            await saveItems();
            newItemInput.value = '';
            renderItems();
            newItemInput.focus();
        }

        // Clear all items
        async function clearAll() {
            if (confirm('Are you sure you want to delete all tasks?')) {
                items = [];
                await saveItems();
                renderItems();
            }
        }

        // Save items to Google Drive
        async function saveItems() {
            if (!accessToken) return;

            try {
                showSyncStatus('Syncing...', 'syncing');

                const fileContent = JSON.stringify(items, null, 2);

                if (!fileId) {
                    // Create new file
                    const response = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: FILE_NAME,
                            parents: ['appDataFolder']
                        })
                    });

                    const createdFile = await response.json();
                    if (createdFile.id) {
                        fileId = createdFile.id;
                    } else {
                        throw new Error('Failed to create file');
                    }
                }

                // Update file content
                const updateResponse = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: fileContent
                });

                if (updateResponse.ok) {
                    showSyncStatus('Synced', 'success');
                    setTimeout(() => {
                        syncStatus.textContent = '';
                    }, 2000);
                } else {
                    throw new Error('Failed to update file');
                }
            } catch (error) {
                console.error('Error saving items:', error);
                showSyncStatus('Sync failed. Retrying...', 'error');
            }
        }

        // Load items from Google Drive
        async function loadItems() {
            if (!accessToken) return;

            try {
                loadingSection.style.display = 'block';
                checklistSection.style.display = 'none';
                showSyncStatus('Loading...', 'syncing');

                // Find existing file
                const response = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FILE_NAME}'&fields=files(id,name)`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                const data = await response.json();

                if (data.files && data.files.length > 0) {
                    fileId = data.files[0].id;

                    // Load file content
                    const fileResponse = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                        headers: {
                            'Authorization': `Bearer ${accessToken}`
                        }
                    });

                    if (fileResponse.ok) {
                        items = await fileResponse.json();
                    } else {
                        items = [];
                    }
                } else {
                    items = [];
                }

                loadingSection.style.display = 'none';
                checklistSection.style.display = 'block';
                renderItems();
                showSyncStatus('Loaded successfully', 'success');
                setTimeout(() => {
                    syncStatus.textContent = '';
                }, 2000);
            } catch (error) {
                console.error('Error loading items:', error);
                loadingSection.style.display = 'none';
                checklistSection.style.display = 'block';
                showSyncStatus('Failed to load. Check credentials.', 'error');
            }
        }

        // Show sync status
        function showSyncStatus(message, type) {
            syncStatus.textContent = message;
            syncStatus.className = `sync-status ${type}`;
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        addBtn.addEventListener('click', addItem);
        newItemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });
        clearAllBtn.addEventListener('click', clearAll);

        // Initialize on page load
        initializeGoogleAPI();
    </script>
</body>
</html>
