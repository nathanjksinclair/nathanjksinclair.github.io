<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Gist Checklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .checklist-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        .checklist-header {
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .checklist-header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .header-info {
            flex: 1;
            min-width: 200px;
        }
        .user-info {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .auth-section {
            margin-bottom: 20px;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .checklist-item:hover {
            background: #e9ecef;
        }
        .checklist-item.completed {
            background: #d4edda;
        }
        .checklist-item.completed .item-text {
            text-decoration: line-through;
            color: #6c757d;
        }
        .form-check-input {
            width: 1.5rem;
            height: 1.5rem;
            margin-right: 12px;
            cursor: pointer;
            border: 2px solid #667eea;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .item-text {
            flex: 1;
            cursor: pointer;
            font-size: 1.05rem;
            color: #333;
        }
        .btn-delete {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 8px;
            transition: color 0.2s;
        }
        .btn-delete:hover {
            color: #c82333;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .progress-container {
            margin-bottom: 20px;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .sync-status {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 10px;
        }
        .sync-status.syncing {
            color: #0d6efd;
        }
        .sync-status.error {
            color: #dc3545;
        }
        .sync-status.success {
            color: #198754;
        }
        .loading-auth {
            text-align: center;
            padding: 40px 20px;
        }
        .spinner-border {
            margin-bottom: 15px;
        }
        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #24292e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .github-btn:hover {
            background: #1a1e22;
            color: white;
            text-decoration: none;
        }
        .github-btn.logout {
            background: #dc3545;
        }
        .github-btn.logout:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="checklist-container">
        <div class="checklist-header">
            <div class="header-info">
                <h1>📋 My Checklist</h1>
                <small class="user-info" id="user-info">Not signed in</small>
            </div>
            <a class="github-btn" id="auth-btn" href="#" target="_blank">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                <span id="auth-btn-text">Sign in with GitHub</span>
            </a>
        </div>

        <div id="loading-auth" class="loading-auth" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Loading your tasks...</p>
        </div>

        <div id="auth-section" class="auth-section" style="display: none;">
            <!-- Main checklist section -->
            <div id="checklist-section">
                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="progress-text">
                        Progress: <span id="progress-text">0/0</span>
                    </div>
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>

                <!-- Input Section -->
                <div class="input-group mb-3">
                    <input type="text" id="new-item-input" class="form-control" placeholder="Add a new task..." aria-label="Add a new task">
                    <button class="btn btn-primary" type="button" id="add-btn">Add</button>
                </div>

                <!-- Checklist Items -->
                <div id="checklist-items" class="checklist-items">
                    <!-- Items will be dynamically added here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"/>
                    </svg>
                    <p>No tasks yet. Add one to get started!</p>
                </div>

                <!-- Sync Status -->
                <div class="sync-status" id="sync-status"></div>

                <!-- Clear All Button -->
                <button class="btn btn-outline-danger btn-sm w-100 mt-4" id="clear-all-btn">Clear All</button>
            </div>
        </div>

        <div id="not-auth-section" style="display: none; text-align: center; padding: 40px 20px;">
            <p class="text-muted mb-3">Sign in with your GitHub account to store and sync your tasks.</p>
            <p class="text-muted small">Your tasks are stored in a private GitHub Gist.</p>
        </div>
    </div>

    <script>
        // Configuration
        const GIST_FILENAME = 'checklist-data.json';
        const STORAGE_TOKEN_KEY = 'github_token';
        const STORAGE_GIST_KEY = 'github_gist_id';

        // State
        let items = [];
        let gistId = null;
        let accessToken = null;

        // DOM Elements
        const authBtn = document.getElementById('auth-btn');
        const authBtnText = document.getElementById('auth-btn-text');
        const authSection = document.getElementById('auth-section');
        const notAuthSection = document.getElementById('not-auth-section');
        const itemsContainer = document.getElementById('checklist-items');
        const newItemInput = document.getElementById('new-item-input');
        const addBtn = document.getElementById('add-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const emptyState = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const syncStatus = document.getElementById('sync-status');
        const userInfo = document.getElementById('user-info');
        const loadingAuth = document.getElementById('loading-auth');
        const checklistSection = document.getElementById('checklist-section');

        // Check for OAuth callback
        function handleOAuthCallback() {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const token = params.get('access_token');

            if (token) {
                accessToken = token;
                localStorage.setItem(STORAGE_TOKEN_KEY, token);
                // Clean up URL
                window.history.replaceState({}, document.title, window.location.pathname);
                loadItems();
                return true;
            }
            return false;
        }

        // Initialize auth
        function initializeAuth() {
            // Check if token exists in localStorage
            const storedToken = localStorage.getItem(STORAGE_TOKEN_KEY);
            const storedGistId = localStorage.getItem(STORAGE_GIST_KEY);

            if (storedToken) {
                accessToken = storedToken;
                gistId = storedGistId;
                loginSuccess();
                return;
            }

            // Check for OAuth callback
            if (handleOAuthCallback()) {
                return;
            }

            // Not logged in
            showNotAuthSection();
        }

        // Login success
        function loginSuccess() {
            authSection.style.display = 'block';
            notAuthSection.style.display = 'none';
            authBtn.classList.add('logout');
            authBtnText.textContent = 'Sign out';
            loadItems();
        }

        // Show not authenticated section
        function showNotAuthSection() {
            authSection.style.display = 'none';
            notAuthSection.style.display = 'block';
            authBtn.classList.remove('logout');
            authBtnText.textContent = 'Sign in with GitHub';
            authBtn.href = 'https://github.com/login/oauth/authorize?client_id=Ov23li7BX0jqN3Qhtwl4&scope=gist&redirect_uri=' + encodeURIComponent(window.location.href);
            authBtn.target = '_blank';
        }

        // Handle logout
        function logout() {
            accessToken = null;
            gistId = null;
            items = [];
            localStorage.removeItem(STORAGE_TOKEN_KEY);
            localStorage.removeItem(STORAGE_GIST_KEY);
            showNotAuthSection();
            renderItems();
        }

        // Auth button click
        authBtn.addEventListener('click', (e) => {
            if (accessToken) {
                e.preventDefault();
                logout();
            }
        });

        // Update progress bar
        function updateProgress() {
            const total = items.length;
            const completed = items.filter(item => item.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            progressBar.style.width = percentage + '%';
            progressBar.setAttribute('aria-valuenow', percentage);
            progressText.textContent = `${completed}/${total}`;
        }

        // Render all items
        function renderItems() {
            itemsContainer.innerHTML = '';

            if (items.length === 0) {
                emptyState.style.display = 'block';
                updateProgress();
                return;
            }

            emptyState.style.display = 'none';

            items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `checklist-item ${item.completed ? 'completed' : ''}`;
                itemDiv.innerHTML = `
                    <input type="checkbox" class="form-check-input" ${item.completed ? 'checked' : ''} data-index="${index}">
                    <span class="item-text" data-index="${index}">${escapeHtml(item.text)}</span>
                    <button class="btn-delete" data-index="${index}">×</button>
                `;
                itemsContainer.appendChild(itemDiv);
            });

            // Attach event listeners
            document.querySelectorAll('.form-check-input').forEach(checkbox => {
                checkbox.addEventListener('change', toggleItem);
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', deleteItem);
            });

            document.querySelectorAll('.item-text').forEach(text => {
                text.addEventListener('click', function() {
                    const checkbox = this.parentElement.querySelector('.form-check-input');
                    checkbox.checked = !checkbox.checked;
                    toggleItem.call(checkbox);
                });
            });

            updateProgress();
        }

        // Toggle item completion
        async function toggleItem(e) {
            const index = parseInt(e.target.dataset.index);
            items[index].completed = !items[index].completed;
            await saveItems();
            renderItems();
        }

        // Delete item
        async function deleteItem(e) {
            const index = parseInt(e.target.dataset.index);
            items.splice(index, 1);
            await saveItems();
            renderItems();
        }

        // Add new item
        async function addItem() {
            const text = newItemInput.value.trim();
            if (!text) {
                newItemInput.focus();
                return;
            }

            items.push({
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            });

            await saveItems();
            newItemInput.value = '';
            renderItems();
            newItemInput.focus();
        }

        // Clear all items
        async function clearAll() {
            if (confirm('Are you sure you want to delete all tasks?')) {
                items = [];
                await saveItems();
                renderItems();
            }
        }

        // Save items to GitHub Gist
        async function saveItems() {
            if (!accessToken) return;

            try {
                showSyncStatus('Syncing...', 'syncing');

                const fileContent = JSON.stringify(items, null, 2);

                if (!gistId) {
                    // Create new gist
                    const response = await fetch('https://api.github.com/gists', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Accept': 'application/vnd.github+json'
                        },
                        body: JSON.stringify({
                            description: 'Checklist tasks',
                            public: false,
                            files: {
                                [GIST_FILENAME]: {
                                    content: fileContent
                                }
                            }
                        })
                    });

                    const gist = await response.json();
                    if (gist.id) {
                        gistId = gist.id;
                        localStorage.setItem(STORAGE_GIST_KEY, gistId);
                    } else {
                        throw new Error('Failed to create gist: ' + JSON.stringify(gist));
                    }
                } else {
                    // Update existing gist
                    const updateResponse = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Accept': 'application/vnd.github+json'
                        },
                        body: JSON.stringify({
                            files: {
                                [GIST_FILENAME]: {
                                    content: fileContent
                                }
                            }
                        })
                    });

                    if (!updateResponse.ok) {
                        throw new Error('Failed to update gist: ' + updateResponse.status);
                    }
                }

                showSyncStatus('Synced ✓', 'success');
                setTimeout(() => {
                    syncStatus.textContent = '';
                }, 2000);
            } catch (error) {
                console.error('Error saving items:', error);
                showSyncStatus('Sync failed', 'error');
            }
        }

        // Load items from GitHub Gist
        async function loadItems() {
            if (!accessToken) return;

            try {
                loadingAuth.style.display = 'block';
                checklistSection.style.display = 'none';
                showSyncStatus('Loading...', 'syncing');

                // Get user info
                const userResponse = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Accept': 'application/vnd.github+json'
                    }
                });
                const userData = await userResponse.json();
                userInfo.textContent = `Signed in as @${userData.login}`;

                // Get gists
                const gistsResponse = await fetch('https://api.github.com/gists', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Accept': 'application/vnd.github+json'
                    }
                });

                const gists = await gistsResponse.json();
                const checklistGist = gists.find(g => g.files[GIST_FILENAME]);

                if (checklistGist) {
                    gistId = checklistGist.id;
                    localStorage.setItem(STORAGE_GIST_KEY, gistId);

                    // Load file content
                    const fileUrl = checklistGist.files[GIST_FILENAME].raw_url;
                    const fileResponse = await fetch(fileUrl);

                    if (fileResponse.ok) {
                        items = await fileResponse.json();
                    } else {
                        items = [];
                    }
                } else {
                    items = [];
                }

                loadingAuth.style.display = 'none';
                checklistSection.style.display = 'block';
                renderItems();
                showSyncStatus('Loaded ✓', 'success');
                setTimeout(() => {
                    syncStatus.textContent = '';
                }, 2000);
            } catch (error) {
                console.error('Error loading items:', error);
                loadingAuth.style.display = 'none';
                checklistSection.style.display = 'block';
                showSyncStatus('Failed to load', 'error');
            }
        }

        // Show sync status
        function showSyncStatus(message, type) {
            syncStatus.textContent = message;
            syncStatus.className = `sync-status ${type}`;
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        addBtn.addEventListener('click', addItem);
        newItemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });
        clearAllBtn.addEventListener('click', clearAll);

        // Initialize on page load
        initializeAuth();
    </script>
</body>
</html>
